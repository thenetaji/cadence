name: iOS unsigned IPA

# Builds an unsigned IPA of one app for sideloading with SideStore (see apps/finance/docs/SIDELOAD.md).
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder under apps/ to build
        default: finance
        required: true
      scheme:
        description: Xcode scheme (the app's display name, as in app.json)
        default: Finance
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP: ${{ inputs.app || 'finance' }}
      APP_SCHEME: ${{ inputs.scheme || 'Finance' }}
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57's ExpoModulesJSI headers use Xcode 27's Swift/C++ interop annotations; Xcode 26 rejects them.
      - name: Select Xcode 27+
        run: |
          echo "Installed:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "No Xcode 27+ on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      # Uses the version pinned in the root package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm skips dependency postinstall scripts, so copy Skia's prebuilt binaries explicitly.
      - name: Install Skia prebuilt libraries
        working-directory: apps/${{ env.APP }}
        run: pnpm exec install-skia

      - name: Generate the native iOS project
        working-directory: apps/${{ env.APP }}
        run: pnpm exec expo prebuild -p ios --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/${{ env.APP }}/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles(format('apps/{0}/ios/Podfile.lock', env.APP)) }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: apps/${{ env.APP }}
        run: cd ios && pod install

      - name: Archive (unsigned)
        working-directory: apps/${{ env.APP }}
        run: |
          set -o pipefail
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1; then
            echo "::group::Errors"; grep -nE "error:|fatal error|\*\* ARCHIVE FAILED" build/xcodebuild.log | head -n 60; echo "::endgroup::"
            tail -n 80 build/xcodebuild.log
            exit 1
          fi
          tail -n 20 build/xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/${{ env.APP }}/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        working-directory: apps/${{ env.APP }}
        run: |
          APP_BUNDLE=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -n 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_BUNDLE" build/ipa/Payload/
          (cd build/ipa && zip -qry "../${APP_SCHEME}-unsigned.ipa" Payload)
          ls -lh "build/${APP_SCHEME}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SCHEME }}-unsigned-ipa
          path: apps/${{ env.APP }}/build/${{ env.APP_SCHEME }}-unsigned.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ env.APP }}/build/${{ env.APP_SCHEME }}-unsigned.ipa
