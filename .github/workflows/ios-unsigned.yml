name: iOS unsigned IPA

# Builds an unsigned IPA of one app for sideloading with SideStore (see apps/finance/docs/SIDELOAD.md).
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder under apps/ to build
        default: finance
        required: true
      scheme:
        description: Xcode scheme (the app's display name, as in app.json)
        default: Finance
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP: ${{ inputs.app || 'finance' }}
      APP_SCHEME: ${{ inputs.scheme || 'Finance' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm skips react-native-skia's postinstall, and `pod install` aborts without its prebuilt binaries.
      - name: Install Skia binaries
        working-directory: apps/${{ env.APP }}
        run: pnpm exec install-skia

      - name: Generate the native iOS project
        working-directory: apps/${{ env.APP }}
        run: pnpm exec expo prebuild -p ios --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/${{ env.APP }}/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles(format('apps/{0}/ios/Podfile.lock', env.APP)) }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: apps/${{ env.APP }}
        run: cd ios && pod install

      - name: Archive (unsigned)
        working-directory: apps/${{ env.APP }}
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package IPA
        working-directory: apps/${{ env.APP }}
        run: |
          APP_BUNDLE=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -n 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_BUNDLE" build/ipa/Payload/
          (cd build/ipa && zip -qry ../${APP_SCHEME}-unsigned.ipa Payload)
          ls -lh build/${APP_SCHEME}-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SCHEME }}-unsigned-ipa
          path: apps/${{ env.APP }}/build/${{ env.APP_SCHEME }}-unsigned.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ env.APP }}/build/${{ env.APP_SCHEME }}-unsigned.ipa
